<header class="site-header">
    <img src="images/toolxone-logo.jpg" alt="ToolXone Logo" class="site-logo">

<main class="tool-area">

    <div class="weight-card">

    <div class="weight-card-header">

        <div class="weight-icon">
            ⚖️
        </div>

        <h1>Weight Converter</h1>

        <p>
            Convert between commonly used weight and mass units quickly and accurately.
        </p>

    </div>


    <div class="weight-input-group">

        <label for="value">
            Amount
        </label>

        <input
            type="number"
            id="value"
            placeholder="Enter value"
            step="any"
            min="0"
            inputmode="decimal"
            autocomplete="off"
        >

    </div>


    <div class="weight-unit-group">

        <label for="fromUnit">
            From
        </label>

        <select id="fromUnit">

            <option value="kg">
                Kilogram (kg)
            </option>

            <option value="g">
                Gram (g)
            </option>

            <option value="mg">
                Milligram (mg)
            </option>

            <option value="ug">
                Microgram (µg)
            </option>

            <option value="t">
                Metric Ton (t)
            </option>

            <option value="lb">
                Pound (lb)
            </option>

            <option value="oz">
                Ounce (oz)
            </option>

            <option value="st">
                Stone (st)
            </option>

            <option value="ct">
                Carat (ct)
            </option>

            <option value="ozt">
                Troy Ounce (ozt)
            </option>

        </select>

    </div>


    <button
        type="button"
        id="swapButton"
        class="swap-btn"
        aria-label="Swap source and target units"
        title="Swap units"
    >
        ⇅ Swap Units
    </button>


    <div class="weight-unit-group">

        <label for="toUnit">
            To
        </label>

        <select id="toUnit">

            <option value="lb">
                Pound (lb)
            </option>

            <option value="kg">
                Kilogram (kg)
            </option>

            <option value="g">
                Gram (g)
            </option>

            <option value="mg">
                Milligram (mg)
            </option>

            <option value="ug">
                Microgram (µg)
            </option>

            <option value="t">
                Metric Ton (t)
            </option>

            <option value="oz">
                Ounce (oz)
            </option>

            <option value="st">
                Stone (st)
            </option>

            <option value="ct">
                Carat (ct)
            </option>

            <option value="ozt">
                Troy Ounce (ozt)
            </option>

        </select>

    </div>


    <button
        type="button"
        id="convertButton"
        class="convert-btn"
    >
        Convert
    </button>


    <div
        class="result"
        id="result"
        aria-live="polite"
    ></div>

</div>
