<main class="body-fat-page">


<section class="body-fat-card">


<h1>
    🔥 Body Fat Calculator
</h1>


<p class="tool-subtitle">
    Estimate your body fat percentage from your body measurements using metric or imperial units.
</p>


<h2>
    Calculate Your Body Fat
</h2>


<!-- ==================================================
     Sex
================================================== -->

<div class="input-group">

    <label for="sex">
        Sex
    </label>


    <select id="sex">

        <option value="male">
            Male
        </option>

        <option value="female">
            Female
        </option>

    </select>

</div>


<!-- ==================================================
     Unit Switch
================================================== -->

<div class="unit-switch">

    <button
        type="button"
        class="unit-btn active"
        id="metricBtn"
    >
        Metric
    </button>


    <button
        type="button"
        class="unit-btn"
        id="imperialBtn"
    >
        Feet / Pounds
    </button>

</div>


<!-- ==================================================
     Metric Inputs
================================================== -->

<div class="metric-inputs">


    <!-- Height -->

    <div class="input-group">

        <label for="heightCm">
            Height (cm)
        </label>

        <input
            type="number"
            id="heightCm"
            placeholder="Example: 175"
            min="100"
            max="250"
            step="0.1"
        >

    </div>


    <!-- Neck -->

    <div class="input-group">

        <label for="neckCm">
            Neck (cm)
        </label>

        <input
            type="number"
            id="neckCm"
            placeholder="Example: 38"
            min="15"
            max="80"
            step="0.1"
        >

    </div>


    <!-- Waist -->

    <div class="input-group">

        <label for="waistCm">
            Waist (cm)
        </label>

        <input
            type="number"
            id="waistCm"
            placeholder="Example: 85"
            min="30"
            max="200"
            step="0.1"
        >

    </div>


    <!-- Hip — Female -->

    <div
        class="input-group female-only"
        id="hipMetricGroup"
    >

        <label for="hipCm">
            Hip (cm)
        </label>

        <input
            type="number"
            id="hipCm"
            placeholder="Example: 100"
            min="40"
            max="200"
            step="0.1"
        >

    </div>


    <!-- Weight -->

    <div class="input-group">

        <label for="weightKg">
            Weight (kg)
        </label>

        <input
            type="number"
            id="weightKg"
            placeholder="Example: 70"
            min="20"
            max="500"
            step="0.1"
        >

    </div>


</div>


<!-- ==================================================
     Imperial Inputs
================================================== -->

<div
    class="imperial-inputs"
    style="display:none;"
>


    <!-- Height Feet -->

    <div class="input-group">

        <label for="heightFt">
            Height (feet)
        </label>

        <input
            type="number"
            id="heightFt"
            placeholder="Example: 5"
            min="3"
            max="8"
            step="1"
        >

    </div>


    <!-- Height Inches -->

    <div class="input-group">

        <label for="heightIn">
            Height (inches)
        </label>

        <input
            type="number"
            id="heightIn"
            placeholder="Example: 9"
            min="0"
            max="11.9"
            step="0.1"
        >

    </div>


    <!-- Neck -->

    <div class="input-group">

        <label for="neckIn">
            Neck (inches)
        </label>

        <input
            type="number"
            id="neckIn"
            placeholder="Example: 15"
            min="6"
            max="32"
            step="0.1"
        >

    </div>


    <!-- Waist -->

    <div class="input-group">

        <label for="waistIn">
            Waist (inches)
        </label>

        <input
            type="number"
            id="waistIn"
            placeholder="Example: 34"
            min="12"
            max="80"
            step="0.1"
        >

    </div>


    <!-- Hip — Female -->

    <div
        class="input-group female-only"
        id="hipImperialGroup"
    >

        <label for="hipIn">
            Hip (inches)
        </label>

        <input
            type="number"
            id="hipIn"
            placeholder="Example: 39"
            min="16"
            max="80"
            step="0.1"
        >

    </div>


    <!-- Weight -->

    <div class="input-group">

        <label for="weightLb">
            Weight (pounds)
        </label>

        <input
            type="number"
            id="weightLb"
            placeholder="Example: 154"
            min="44"
            max="1100"
            step="0.1"
        >

    </div>


</div>
